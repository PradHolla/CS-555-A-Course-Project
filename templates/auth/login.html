{% extends "base.html" %}

{% block title %}Login - Expense Splitter{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-16">
    <div class="bg-white rounded-xl shadow-md p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Welcome Back</h1>
            <p class="text-gray-600">Enter your email to receive a login code</p>
        </div>

        <form action="{{ url_for('auth.request_otp') }}" method="POST">
            <div class="mb-6">
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                    Email Address
                </label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    required
                    placeholder="you@example.com"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent"
                >
            </div>

            <button 
                type="submit"
                class="w-full px-6 py-3 bg-gradient-to-r from-emerald-600 to-teal-600 text-white rounded-lg font-semibold hover:from-emerald-700 hover:to-teal-700 transition-all duration-200 shadow-lg">
                Send Login Code
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-600">
            <p>You'll receive a 6-digit code via email</p>
        </div>
    </div>
</div>
{% endblock %}
