{% extends "base.html" %}

{% block title %}Verify Code - Expense Splitter{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-16">
    <div class="bg-white rounded-xl shadow-md p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Enter Verification Code</h1>
            <p class="text-gray-600">We sent a 6-digit code to</p>
            <p class="text-emerald-600 font-semibold">{{ email }}</p>
        </div>

        <form action="{{ url_for('auth.verify_otp') }}" method="POST">
            <input type="hidden" name="email" value="{{ email }}">
            
            <div class="mb-6">
                <label for="otp" class="block text-sm font-medium text-gray-700 mb-2">
                    Verification Code
                </label>
                <input 
                    type="text" 
                    id="otp" 
                    name="otp" 
                    required
                    maxlength="6"
                    pattern="[0-9]{6}"
                    placeholder="000000"
                    class="w-full px-4 py-3 text-center text-2xl font-mono tracking-widest border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent"
                    autofocus
                >
            </div>

            <button 
                type="submit"
                class="w-full px-6 py-3 bg-gradient-to-r from-emerald-600 to-teal-600 text-white rounded-lg font-semibold hover:from-emerald-700 hover:to-teal-700 transition-all duration-200 shadow-lg">
                Verify & Login
            </button>
        </form>

        <div class="mt-6 text-center">
            <form action="{{ url_for('auth.request_otp') }}" method="POST" style="display:inline;">
                <input type="hidden" name="email" value="{{ email }}">
                <button type="submit" class="text-emerald-600 hover:text-emerald-700 text-sm font-medium">
                    Didn't receive code? Resend
                </button>
            </form>
        </div>

        <div class="mt-4 text-center text-xs text-gray-500">
            <p>Code expires in 10 minutes</p>
        </div>
    </div>
</div>
{% endblock %}
