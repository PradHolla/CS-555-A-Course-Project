[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --cov=services.reminder_service
    --cov=services.notification_service
    --cov=services.dashboard_service
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=80
