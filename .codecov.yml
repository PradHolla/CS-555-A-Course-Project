codecov:
  require_ci_to_pass: yes

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
        base: auto
    patch:
      default:
        target: 80%
        threshold: 0%
        
comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
